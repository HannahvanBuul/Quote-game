<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teamweekend Quote Game</title>
<meta name="theme-color" content="#6a0091">
<link rel="icon" href="logo.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column phone app. Flat club-purple header, white cards with hairline borders, purple for structure, pink only for small live accents. */
:root{
  --paper:#f6f4f9; --card:#ffffff; --ink:#1f1029; --muted:#6e6378; --line:#e6e0ec; --line-2:#d6cde0;
  --club:#6a0091; --club-2:#53007a; --accent:#6a0091; --club-ink:#ffffff; --tint:#f3ebfa; --lilac:#dcc4f2;
  --dauber:#c93d8f; --dauber-soft:#fbe8f3; --good:#23845a; --bad:#c43c5e; --hilite:#dcc4f2; --yellow:#ffffff;
  --r:12px; --r-sm:8px;
  --display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Manrope",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#140b1b; --card:#1d1226; --ink:#f2ecf7; --muted:#a898b5; --line:#33253f; --line-2:#45334f;
  --club:#5c0080; --club-2:#4a0068; --accent:#d0a6f5; --club-ink:#ffffff; --tint:#2a1838; --lilac:#d2b4ee;
  --dauber:#ec6db3; --dauber-soft:#3d1830; --good:#5cc995; --bad:#f07893; --hilite:#d2b4ee; --yellow:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#140b1b; --card:#1d1226; --ink:#f2ecf7; --muted:#a898b5; --line:#33253f; --line-2:#45334f;
  --club:#5c0080; --club-2:#4a0068; --accent:#d0a6f5; --club-ink:#ffffff; --tint:#2a1838; --lilac:#d2b4ee;
  --dauber:#ec6db3; --dauber-soft:#3d1830; --good:#5cc995; --bad:#f07893; --hilite:#d2b4ee; --yellow:#ffffff; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--club)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--dauber);outline-offset:2px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--club);color:var(--club-ink)}
header .wrap{padding-block:12px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:10px;min-width:0}
.brandmark img{width:40px;height:40px;flex:none}
.club{font:600 .66rem var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.75}
h1{font:600 1.15rem/1.15 var(--display);margin:0;letter-spacing:-.01em;display:flex;gap:6px;flex-wrap:wrap}
h1 span{color:var(--lilac)}
.who{font-size:.8rem;opacity:.85}
.who button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;border:0;background:transparent;color:var(--club-ink);opacity:.65;font:600 .84rem var(--body);padding:10px 8px 11px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{opacity:1;border-bottom-color:#fff}
nav button:focus-visible{outline-color:#fff;outline-offset:-2px}
nav button[data-count]::after{content:attr(data-count);display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--dauber);color:#fff;font:700 .64rem var(--body);vertical-align:1px}

/* type & basics */
main .wrap{padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}
h2{font:600 1.25rem/1.25 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font:600 1rem/1.3 var(--display);margin:0}
.lede{color:var(--muted);margin:4px 0 0;max-width:62ch}
.eyebrow{font:700 .68rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.small{font-size:.82rem;color:var(--muted)}
.notice{background:var(--tint);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:.9rem}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h2{color:var(--ink)}
.empty p{margin:0;max-width:44ch}
.err{color:var(--bad);font-size:.86rem;margin:0}
.target{font-size:.86rem;color:var(--muted);margin:0}
.target b{color:var(--ink)}

/* buttons & forms */
.btn{font:700 .9rem var(--body);border:1px solid transparent;border-radius:var(--r-sm);padding:10px 16px;cursor:pointer;background:var(--club);color:var(--club-ink);transition:background .15s}
.btn:hover{background:var(--club-2)}
.btn.primary{background:var(--club);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--tint)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{all:unset;cursor:pointer;color:var(--muted);font-size:.8rem;text-decoration:underline;text-underline-offset:3px}
.linkbtn:focus-visible{outline:2px solid var(--dauber);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline input{flex:1 1 200px;min-width:0;width:auto}
input,select,textarea{font:500 .95rem var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 12px;width:100%}
textarea{resize:vertical;line-height:1.45}
label{font-weight:600;font-size:.84rem;display:flex;flex-direction:column;gap:6px}
.badge{display:inline-block;background:rgb(255 255 255 / .18);color:#fff;font:700 .64rem var(--body);letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:2px 6px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.chips li{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 4px 4px 10px;font-weight:600;font-size:.88rem;max-width:100%}
.chips li span{overflow-wrap:anywhere}
.chips button{all:unset;cursor:pointer;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.chips button:hover{background:var(--dauber-soft);color:var(--bad)}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.qlist li{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:8px 0}
.qlist li:first-child{border-top:0}
.qlist li span{min-width:0;overflow-wrap:anywhere}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;list-style:none;margin:0;padding:0}
.names button,.names span.taken{width:100%;font:700 .95rem var(--body);border-radius:var(--r);padding:14px 12px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);cursor:pointer;text-align:center;display:block;overflow-wrap:anywhere;transition:border-color .15s,background .15s}
.names button:hover{border-color:var(--club);background:var(--tint)}
.names span.taken{opacity:.5;cursor:default;font-weight:600}
.names span.taken small{display:block;font-size:.7rem;color:var(--muted)}

/* hero */
.hero{background:var(--club);color:var(--club-ink);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.hero .eyebrow{color:var(--lilac)}
.hero h2{font-size:1.6rem;color:#fff}
.hero .sub{opacity:.8;font-size:.86rem;margin:2px 0 0}
.meter{height:6px;border-radius:999px;background:rgb(255 255 255 / .2);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:999px;background:#fff;transition:width .6s ease}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgb(255 255 255 / .18);padding-top:12px}
.stat{display:flex;flex-direction:column;min-width:0;padding-left:12px;border-left:1px solid rgb(255 255 255 / .18)}
.stat:first-child{padding-left:0;border-left:0}
.stat b{font:600 1.4rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat small{font-size:.75rem;opacity:.6}
.stat span{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-top:2px}
.badges{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.badges li{font:600 .72rem var(--body);border-radius:4px;padding:3px 8px;color:rgb(255 255 255 / .5);border:1px solid rgb(255 255 255 / .22)}
.badges li.got{background:#fff;color:var(--club);border-color:#fff}
.hero.win{text-align:center;align-items:center;gap:8px;padding:24px 18px}
.hero.win h2{font-size:1.6rem}
.hero.win .crown{font:600 1.8rem/1 var(--display);color:var(--lilac)}
.hero.win .btn.ghost{background:#fff;border-color:#fff;color:var(--club)}

/* live strip & nudges */
.ticker{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:.86rem;min-width:0}
.ticker>span:not(.live){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticker>div{min-width:0;display:flex;flex-direction:column;gap:4px}
.ticker .one{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live{flex:none;font:700 .64rem/1.9 var(--body);letter-spacing:.1em;color:var(--dauber);display:flex;align-items:center;gap:5px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dauber)}
.nudge{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:.9rem}
.nudge .ic{flex:none;width:28px;height:28px;border-radius:8px;background:var(--tint);color:var(--accent);display:grid;place-items:center;font:700 .95rem var(--display)}
.nudge p{margin:0;padding-top:3px}
.nudge b{color:var(--accent)}
.cm{display:block;background:var(--tint);border-radius:2px var(--r-sm) var(--r-sm) var(--r-sm);padding:6px 10px;font-size:.86rem;font-style:italic;overflow-wrap:anywhere;white-space:normal}

/* quote grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr}}
.sq{position:relative;min-height:104px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;font:600 .9rem/1.3 var(--body);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:10px;transition:border-color .15s,background .15s,transform .1s}
.sq:hover{border-color:var(--club)}
.sq:active{transform:scale(.97)}
.sq q{quotes:"“" "”"}
.sq .meta{font:600 .7rem var(--body);color:var(--muted);letter-spacing:.01em}
.sq:not([disabled]):not(.hit) .meta::before{content:"+1 · ";color:var(--accent)}
.sq.hit{background:var(--tint);border-color:color-mix(in srgb,var(--club) 35%,var(--line))}
.sq.hit .meta{padding-right:50px}
.sq.hit::before{content:"";position:absolute;right:6px;bottom:6px;width:48px;height:42px;background:var(--dauber);transform:rotate(-10deg);clip-path:path('M24 42 C7 30 0 21 0 12 C0 4.5 6 0 12.7 0 C18 0 21.7 3 24 6.7 C26.3 3 30 0 35.3 0 C42 0 48 4.5 48 12 C48 21 41 30 24 42 Z')}
.sq.hit::after{content:attr(data-initials);position:absolute;right:6px;bottom:11px;width:48px;height:30px;display:grid;place-items:center;color:#fff;font:700 .8rem var(--display);transform:rotate(-10deg);font-variant-numeric:tabular-nums}
.sq.hit .meta{color:var(--accent)}
.sq[disabled]{cursor:default;opacity:.7}
.sq[disabled]:hover{border-color:var(--line)}
.grid.bingo{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.grid.bingo.b3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.bingo .sq{min-height:0;aspect-ratio:1/1.08;padding:8px;gap:4px;font:600 .74rem/1.22 var(--body);overflow:hidden;hyphens:auto;overflow-wrap:anywhere;max-width:100%}
.grid.bingo.b3 .sq{font-size:.82rem;aspect-ratio:1/.95}
.grid.bingo .sq q{padding-right:0;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.grid.bingo .sq .meta{font-size:.62rem;padding-right:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1em}
.grid.bingo .sq.hit::before{width:32px;height:28px;right:3px;bottom:3px;clip-path:path('M16 28 C4.7 20 0 14 0 8 C0 3 4 0 8.5 0 C12 0 14.5 2 16 4.5 C17.5 2 20 0 23.5 0 C28 0 32 3 32 8 C32 14 27.3 20 16 28 Z')}
.grid.bingo .sq.hit::after{width:32px;height:20px;right:3px;bottom:7px;font-size:.6rem}
.grid.bingo .sq.hit .meta{padding-right:30px}
.grid.bingo .sq:not([disabled]):not(.hit) .meta::before{content:""}
.sq.line{background:var(--club);border-color:var(--club);color:#fff}
.sq.line .meta{color:rgb(255 255 255 / .8)}
.sq.line.hit::before{background:#fff}
.sq.line.hit::after{color:#6a0091}
@media (min-width:560px){.grid.bingo .sq{font-size:.86rem;padding:10px}}
.sq.pop{animation:pop .4s ease-out}
@media (prefers-reduced-motion:no-preference){.sq.pop::before,.sq.pop::after,.grid.intro .sq.hit::before,.grid.intro .sq.hit::after{animation:stamp .4s cubic-bezier(.2,.9,.3,1.4) both}@keyframes stamp{from{transform:rotate(-10deg) scale(1.9);opacity:0}}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.sq.hint{box-shadow:0 0 0 2px var(--dauber-soft);border-color:var(--dauber)}

/* ranking */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.pod .av{width:44px;height:44px;border-radius:50%;background:var(--tint);color:var(--accent);display:grid;place-items:center;font:600 1rem var(--display);border:1px solid var(--line-2)}
.pod.p1 .av{width:52px;height:52px;background:var(--club);color:#fff;border-color:var(--club)}
.pod .nm{font-weight:700;font-size:.84rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .blk{width:100%;border-radius:var(--r-sm) var(--r-sm) 2px 2px;background:var(--tint);color:var(--accent);display:flex;flex-direction:column;align-items:center;padding-top:10px;font:600 1.25rem var(--display);font-variant-numeric:tabular-nums;border:1px solid var(--line)}
.pod .blk small{font:600 .68rem var(--body);opacity:.75}
.pod.p1 .blk{height:104px;background:var(--club);color:#fff;border-color:var(--club)}
.pod.p2 .blk{height:80px}.pod.p3 .blk{height:62px}
.board{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:1.8rem 1fr auto auto auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.head{font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-block:8px;background:var(--paper)}
.pos{font:600 1rem var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.row.top1 .pos{color:var(--accent)}
.row.head .num,.row.head .total{font:inherit}
.panel p{margin:0}
.me-row{background:var(--tint)}
.name{font-weight:700;min-width:0;overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums;text-align:right;min-width:2.4rem;font-size:.88rem}
.plus{color:var(--good)} .min{color:var(--bad)}
.total{font:600 1.05rem var(--display);font-variant-numeric:tabular-nums;text-align:right;min-width:2.4rem}
.mv{font:700 .68rem var(--body);margin-left:6px}
.mv.up{color:var(--good)}.mv.down{color:var(--bad)}
.award{display:inline-block;font:700 .62rem var(--body);letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 6px;margin-left:6px;background:var(--tint);color:var(--accent);vertical-align:2px}
.me-row .award{background:var(--card)}
.award.said{background:var(--dauber-soft);color:var(--dauber)}

/* log */
.log{display:flex;flex-direction:column;list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.log li{padding:12px 14px;display:grid;grid-template-columns:4.2rem 1fr;gap:3px 12px;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log li>*:not(time){grid-column:2}
.log time{font:600 .72rem var(--body);color:var(--muted);grid-row:span 5;padding-top:2px;font-variant-numeric:tabular-nums}
.log .q{font-weight:700}
.log .s{font-size:.82rem;color:var(--muted)}
.log .cm{margin-top:4px}
.log .linkbtn{justify-self:start;font-size:.76rem;margin-top:2px}

/* rules */
.rules{display:flex;flex-direction:column;gap:12px}
.rules section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.rules p{margin:0}
.rules ol,.rules ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.rules ol{counter-reset:st}
.rules ol li{counter-increment:st;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.rules ol li::before{content:counter(st);width:26px;height:26px;border-radius:7px;background:var(--club);color:#fff;font:600 .8rem/26px var(--display);text-align:center}
.rules ul li{display:grid;grid-template-columns:12px 1fr;gap:8px}
.rules ul li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--club);margin-top:.55em}
.pts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pt{border-radius:var(--r-sm);padding:12px;background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.pt b{font:600 1.6rem/1 var(--display)}
.pt.plus b{color:var(--good)}.pt.min b{color:var(--bad)}
.pt span{font-size:.84rem;color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgb(20 8 28 / .5);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:90%;overflow:auto}
@media (min-width:600px){.sheet{align-items:center}.sheet .box{border-radius:16px}}
.sheet blockquote{margin:0;font:600 1.2rem/1.3 var(--display)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.row2{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* footer, toast, confetti */
footer .wrap{padding-block:0 32px;display:flex;justify-content:center}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:30;max-width:calc(100% - 32px);box-shadow:0 8px 24px -8px rgb(0 0 0 / .35)}
.toast.big{background:var(--club);color:#fff;font:600 1rem var(--display);padding:12px 18px}
.toast.ouch{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:toastin .3s ease-out}@keyframes toastin{from{transform:translate(-50%,16px);opacity:0}}
  .live::before{animation:blink 1.6s infinite}@keyframes blink{50%{opacity:.25}}
  .pod .blk{animation:rise .6s ease-out both;transform-origin:bottom}@keyframes rise{from{transform:scaleY(.2)}}
}
</style>

<header>
  <div class="wrap">
    <div class="brand">
      <div class="brandmark"><img src="logo.png" alt="Logo v.v. LRC"><div><div class="club">v.v. LRC · teamweekend</div><h1>Teamweekend <span>Quote Game</span></h1></div></div>
      <div class="who" id="who"></div>
    </div>
    <nav role="tablist">
      <button role="tab" id="tab-kaart" data-view="kaart" aria-selected="true">Kaart</button>
      <button role="tab" id="tab-ranking" data-view="ranking" aria-selected="false">Ranking</button>
      <button role="tab" id="tab-log" data-view="log" aria-selected="false">Logboek</button>
      <button role="tab" id="tab-regels" data-view="regels" aria-selected="false">Spelregels</button>
      <button role="tab" id="tab-beheer" data-view="beheer" aria-selected="false">Beheer</button>
    </nav>
  </div>
</header>

<main><div class="wrap" id="view"></div></main>
<footer><div class="wrap" id="foot"></div></footer>
<div id="sheet-root"></div>

<script>
const S={claimsList:[],meta:{},players:[],quotes:[],hits:[],me:null,view:"kaart",db:null,status:"loading",admin:false,uid:null,code:null,unsubs:[]};
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=n=>(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const pName=id=>S.players.find(p=>p.id===id)?.name||"Onbekend";
const fmt=iso=>{try{const d=new Date(iso);return d.toLocaleString("nl-NL",{weekday:"short",hour:"2-digit",minute:"2-digit"})}catch{return ""}};
const localNow=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const slug=t=>t.toLowerCase().normalize("NFD").replace(/[^\w]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"x";
function toast(msg,kind,ms){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast"+(kind?" "+kind:"");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||2600)}
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
function celebrate(big){
  try{navigator.vibrate&&navigator.vibrate(big?[60,40,120]:50)}catch{}
  if(RM)return;
  let c=document.getElementById("confetti");if(!c){c=document.createElement("canvas");c.id="confetti";document.body.appendChild(c)}
  const dpr=devicePixelRatio||1,W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
  const cols=["#6a0091","#d04a9f","#e3c8f7","#ffffff","#ff8fc8","#f5c933"];
  const P=Array.from({length:big?160:70},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*16-6,r:Math.random()*6+4,c:cols[Math.random()*cols.length|0],a:Math.random()*6,s:Math.random()<.35}));
  let f=0;(function tick(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.45;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;
    if(p.s){x.beginPath();x.moveTo(0,p.r*.3);x.bezierCurveTo(-p.r,-p.r*.4,-p.r*.4,-p.r,0,-p.r*.35);x.bezierCurveTo(p.r*.4,-p.r,p.r,-p.r*.4,0,p.r*.3);x.fill()}else x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(++f<110)requestAnimationFrame(tick);else x.clearRect(0,0,W,H)})();
}
const BADGES=[[1,"Eerste vangst"],[5,"Scherp oor"],[10,"Quote-jager"],[20,"Oren van goud"]];
const sgn=n=>(n>0?"+":n<0?"−":"")+Math.abs(n);
function badgeList(total){const b=BADGES.filter(([n])=>n<total);b.push([total,"Volle kaart"]);return b}
const rel=iso=>{const m=Math.round((Date.now()-new Date(iso))/60000);if(!(m>=0))return"";if(m<1)return"zojuist";if(m<60)return m+" min geleden";const h=Math.round(m/60);return h<24?h+" uur geleden":fmt(iso)};
const hitTime=h=>h.createdAt||h.at;
let prevRanks={};try{prevRanks=JSON.parse(localStorage.getItem("qb-ranks")||"{}")}catch{}
let logSeen="";try{logSeen=localStorage.getItem("qb-logseen")||""}catch{}
function detectNew(){
  if(!S.known){S.known=new Set(S.hits.map(h=>h.id));return}
  for(const h of S.hits){if(S.known.has(h.id))continue;S.known.add(h.id);
    if(h.id===S.justHit)continue;
    const q=S.quotes.find(x=>x.id===h.quoteId);
    if(h.sayerId===S.me&&S.me){toast(`Betrapt! ${pName(h.hearerId)} hoorde jou “${q?q.text:"…"}” zeggen. −1`,"ouch",4200);try{navigator.vibrate&&navigator.vibrate([30,60,30])}catch{}}
    else if(h.hearerId!==S.me)toast(`${pName(h.hearerId)} betrapte ${pName(h.sayerId)}!${h.comment?` “${h.comment}”`:""}`,"",h.comment?4000:2600);
  }
}
try{S.me=localStorage.getItem("qb-me")}catch{}
try{const v=location.hash.slice(1);if(["kaart","ranking","log","regels","beheer"].includes(v))S.view=v}catch{}

/* ---------- scoring ---------- */
function scores(){
  const m={};S.players.forEach(p=>m[p.id]={id:p.id,name:p.name,heard:0,said:0});
  S.hits.forEach(h=>{if(m[h.hearerId])m[h.hearerId].heard++;if(m[h.sayerId])m[h.sayerId].said++});
  return Object.values(m).map(r=>({...r,total:r.heard-r.said}))
    .sort((a,b)=>b.total-a.total||b.heard-a.heard||a.name.localeCompare(b.name));
}

/* ---------- render ---------- */
function resolveMe(){if(S.admin||S.status!=="ready")return;const c=S.claimsList.find(x=>x.uid===S.uid);S.me=c?c.id:null}
function render(){
  resolveMe();
  if(S.status==="ready"||S.hits.length)detectNew();
  const unread=S.hits.filter(h=>String(hitTime(h))>logSeen&&h.hearerId!==S.me).length;
  const lb=document.querySelector('nav button[data-view="log"]');if(lb){if(unread&&S.view!=="log")lb.dataset.count=unread>9?"9+":unread;else delete lb.dataset.count}
  if(S.view==="beheer"&&!S.admin)S.view="kaart";
  document.querySelectorAll("nav button").forEach(b=>{b.setAttribute("aria-selected",b.dataset.view===S.view);if(b.dataset.view==="beheer")b.hidden=!S.admin});
  $("#foot").innerHTML=S.status==="adminlogin"?"":S.admin?`<button class="linkbtn" id="admin-out">Uitloggen als beheerder</button>`:`<button class="linkbtn" id="admin-in">Inloggen als beheerder</button>`;
  const me=S.players.find(p=>p.id===S.me);
  $("#who").innerHTML=(me?`Je speelt als <b>${esc(me.name)}</b>${S.admin?` · <button id="switch">wissel</button>`:""}`:"")+(S.admin?`<span class="badge">Beheerder</span>`:"");
  const v=$("#view");
  if(S.status==="loading"){v.innerHTML=`<p class="lede">Spelgegevens laden…</p>`;return}
  if(S.status==="offline"){v.innerHTML=`<div class="notice">De spelstand is niet bereikbaar. Controleer je internetverbinding en of de teamcode klopt.</div><div><button class="btn ghost" id="logout">Andere teamcode invoeren</button></div>`;return}
  if(S.status==="adminlogin"){v.innerHTML=`<form class="panel" id="f-admin"><span class="eyebrow">Beheerder</span><h2>Inloggen als beheerder</h2>
    <p class="small">Alleen de organisator heeft een beheerdersaccount. Spelers hoeven hier niets te doen.</p>
    <label for="in-email">E-mailadres<input id="in-email" type="email" autocomplete="username" required></label>
    <label for="in-pass">Wachtwoord<input id="in-pass" type="password" autocomplete="current-password" required></label>
    <p class="err" id="admin-err" hidden></p>
    <div class="inline"><button class="btn primary">Inloggen</button><button type="button" class="btn ghost" id="admin-cancel">Annuleren</button></div></form>`;return}
  if(S.status==="needcode"){v.innerHTML=`<form class="panel" id="f-code"><span class="eyebrow">Inloggen</span><h2>Vul de teamcode in</h2>
    <p class="small">Deze code krijg je van de organisator. Iedereen met dezelfde code speelt in hetzelfde spel.</p>
    <label for="in-code">Teamcode<input id="in-code" autocomplete="off" autocapitalize="characters" placeholder="bijv. LRC-WEEKEND-7Q4K" required></label>
    <div><button class="btn primary">Inloggen</button></div></form>`;return}
  ({kaart:viewKaart,ranking:viewRanking,log:viewLog,regels:viewRegels,beheer:viewBeheer})[S.view](v);
}

function pickMe(v){
  if(!S.players.length){
    v.innerHTML=S.admin?`<div class="empty"><h2>Nog geen spelers</h2><p>Voeg eerst het team toe onder Beheer. Daarna kiest iedereen hier zijn eigen naam.</p><button class="btn primary" data-go="beheer">Naar Beheer</button></div>`:`<div class="empty"><h2>Nog even geduld</h2><p>De organisator zet de spelers en quotes klaar. Zodra dat gebeurd is, verschijnt hier je naam.</p></div>`;return;
  }
  if(S.admin){
    v.innerHTML=`<div><h2>Als wie speel jij?</h2><p class="lede">Als beheerder kun je vrij kiezen en later wisselen. Spelers kunnen dat niet.</p></div>
    <ul class="names">${S.players.map(p=>`<li><button data-me="${p.id}">${esc(p.name)}</button></li>`).join("")}</ul>`;return;
  }
  const taken=new Set(S.claimsList.map(c=>c.id));
  const cp=S.confirmClaim&&S.players.find(p=>p.id===S.confirmClaim);
  if(cp&&!taken.has(cp.id)){
    v.innerHTML=`<div class="panel"><span class="eyebrow">Bevestigen</span><h2>Ben jij ${esc(cp.name)}?</h2>
      <p class="small">Je naam wordt gekoppeld aan deze telefoon. Daarna kun je niet meer wisselen, en kan niemand anders deze naam kiezen.</p>
      <p class="err" id="claim-err" hidden></p>
      <div class="inline"><button class="btn primary" id="claim-yes">Ja, ik ben ${esc(cp.name)}</button><button class="btn ghost" id="claim-no">Nee, terug</button></div></div>`;return;
  }
  v.innerHTML=`<div><h2>Wie ben jij?</h2><p class="lede">Kies je eigen naam. Let op: je kunt daarna niet meer wisselen.</p><p class="small" style="margin:6px 0 0"><button class="linkbtn" data-view="regels">Lees eerst de spelregels</button></p></div>
  <ul class="names">${S.players.map(p=>taken.has(p.id)
    ?`<li><span class="taken">${esc(p.name)}<small>al gekozen</small></span></li>`
    :`<li><button data-claim="${p.id}">${esc(p.name)}</button></li>`).join("")}</ul>
  <p class="small">Staat je naam er niet bij, of staat er "al gekozen" bij terwijl jij hem niet koos? Vraag de organisator om hulp.</p>
  <p class="small" style="margin:0"><button class="btn ghost" id="logout" style="padding:4px 12px">Andere teamcode</button></p>`;
}

function hstr(t){let h=2166136261;for(const c of t){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}h^=h>>>13;h=Math.imul(h,1540483477);return (h^h>>>15)>>>0}
function cardSize(){const n=S.quotes.length;return n>=16?16:n>=9?9:n}
function cardFor(pid){const k=cardSize();const seed=(S.code||"")+"|"+pid+"|";return [...S.quotes].map(q=>[hstr(seed+q.id),q]).sort((a,b)=>a[0]-b[0]).slice(0,k).map(x=>x[1])}
function bingoLines(k){const n=Math.sqrt(k);if(n<3||n%1)return[];const L=[],r=[...Array(n).keys()];r.forEach(i=>{L.push(r.map(j=>i*n+j));L.push(r.map(j=>j*n+i))});L.push(r.map(j=>j*n+j));L.push(r.map(j=>j*n+n-1-j));return L}
function bingoState(card,heard){const L=bingoLines(card.length);const done=L.filter(l=>l.every(i=>heard.has(card[i].id)));return {count:done.length,cells:new Set(done.flat()),lines:L.length}}
function viewKaart(v){
  const me=S.players.find(p=>p.id===S.me);
  if(!me)return pickMe(v);
  if(!S.quotes.length){
    v.innerHTML=S.admin?`<div class="empty"><h2>De kaart is nog leeg</h2><p>Voeg onder Beheer de uitspraken toe die jullie gaan verzamelen, zoals "Even sparren" of "Dat pakken we offline op".</p><button class="btn primary" data-go="beheer">Quotes toevoegen</button></div>`:`<div class="empty"><h2>De kaart is nog leeg</h2><p>De organisator zet de quotes klaar. Kom zo nog even terug.</p></div>`;return;
  }
  const closed=!!(S.meta&&S.meta.closed);
  const all=scores();const rank=all.findIndex(r=>r.id===me.id);const sc=all[rank]||{total:0,said:0,heard:0};
  const myHits=S.hits.filter(h=>h.hearerId===me.id);
  const byQ={};myHits.forEach(h=>{(byQ[h.quoteId]=byQ[h.quoteId]||[]).push(h)});
  Object.values(byQ).forEach(a=>a.sort((x,y)=>String(hitTime(y)).localeCompare(String(hitTime(x)))));
  const card=cardFor(me.id);const total=card.length;const caught=myHits.length;const distinct=card.filter(q=>byQ[q.id]).length;const bs=bingoState(card,new Set(card.filter(q=>byQ[q.id]).map(q=>q.id)));
  const badges=BADGES.map(([k,l])=>({l,got:caught>=k})).concat(bs.lines?[{l:bs.count>1?`Bingo ×${bs.count}`:"Bingo!",got:bs.count>0}]:[]).concat([{l:"Volle kaart",got:distinct===total}]);
  const latest=[...S.hits].sort((x,y)=>String(hitTime(y)).localeCompare(String(hitTime(x))))[0];
  const lq=latest&&S.quotes.find(x=>x.id===latest.quoteId);
  const open=card.filter(q=>!byQ[q.id]);
  const pool=open.length?open:card;const pick=pool[Math.floor(Date.now()/600000)%pool.length];
  let top="";
  if(closed){const w=all[0];
    top=`<section class="hero win"><div class="crown">♥</div><span class="eyebrow">Eindstand</span><h2>${esc(w.name)} wint het teamweekend!</h2>
      <p class="sub">Met ${sgn(w.total)} punten. ${rank===0?"Gefeliciteerd, dat ben jij!":`Jij eindigde op plek ${rank+1} met ${sgn(sc.total)}.`}</p>
      <div><button class="btn ghost" data-view="ranking" style="background:#fff;border:0;color:var(--club)">Bekijk de eindstand</button></div></section>`;
    if(!S.cheered){S.cheered=true;setTimeout(()=>celebrate(true),300)}}
  const ahead=rank>0?all[rank-1]:null;const gap=ahead?ahead.total-sc.total+1:0;
  const target=closed?"":rank===0&&sc.total>0?`Jij staat <b>bovenaan</b>. Wie aan het eind van het weekend bovenaan staat, wint.`
    :ahead?`Nog <b>${gap} punt${gap===1?"":"en"}</b> om ${esc(ahead.name)} in te halen voor plek ${rank}.`:"";
  const myLast=myHits.map(hitTime).sort().pop();
  const idle=!myLast||(Date.now()-new Date(myLast))>60*60000;
  let nudge="";
  if(!closed){
    if(caught===0)nudge=`<div class="nudge"><div class="ic">!</div><p><b>Spits je oren.</b> Tik op een quote zodra je hem hoort en pak je eerste punt. Elke keer dat je hem hoort, telt opnieuw. Wie zegt als eerste “${esc(pick.text)}”? <button class="linkbtn" data-view="regels">Bekijk de spelregels</button></p></div>`;
    else if(idle)nudge=`<div class="nudge"><div class="ic">!</div><p><b>Al even stil op jouw kaart.</b> Elke keer dat je een quote hoort, is een punt. Probeer een gesprek richting “${esc(pick.text)}” te sturen…</p></div>`;
    else if(distinct===total)nudge=`<div class="nudge"><div class="ic">♥</div><p><b>Volle kaart!</b> Je hebt elke quote op je kaart minstens één keer gehoord. Blijf vangen, want elke keer telt.</p></div>`;
    else if(sc.said>0)nudge=`<div class="nudge"><div class="ic">−</div><p>Je bent al <b>${sc.said}× betrapt</b>. Let op je woorden!</p></div>`;
  }
  v.innerHTML=`${top}<section class="hero"><div><span class="eyebrow">Jouw kaart</span><h2>${caught} keer gevangen</h2><p class="sub">${distinct} van de ${total} quotes op jouw kaart gehoord${bs.lines?` · ${sc.said}× betrapt`:""}</p></div>
    <div class="meter" role="progressbar" aria-valuenow="${distinct}" aria-valuemin="0" aria-valuemax="${total}" aria-label="Verschillende quotes gehoord"><i style="width:${Math.round(distinct/total*100)}%"></i></div>
    <div class="stats"><div class="stat"><b>${sgn(sc.total)}</b><span>Score</span></div><div class="stat"><b>${rank+1}<small style="font-size:.8rem;opacity:.7">/${all.length}</small></b><span>Plek</span></div>${bs.lines?`<div class="stat"><b>${bs.count}</b><span>Bingo</span></div>`:`<div class="stat"><b>${sc.said}</b><span>Betrapt</span></div>`}</div>
    <ul class="badges" aria-label="Badges">${badges.map(b=>`<li class="${b.got?"got":""}">${b.got?"♥ ":""}${esc(b.l)}</li>`).join("")}</ul></section>
    ${target?`<p class="target">${target}</p>`:""}
    ${latest?`<div class="ticker${latest.comment?" tw":""}"><span class="live">LIVE</span><div><span class="one"><b>${esc(pName(latest.hearerId))}</b> betrapte <b>${esc(pName(latest.sayerId))}</b> op “${esc(lq?.text||"…")}” · ${esc(rel(hitTime(latest)))}</span>${latest.comment?`<span class="cm">${esc(latest.comment)}</span>`:""}</div></div>`:""}
    ${nudge}
    <div class="grid${bs.lines?" bingo b"+Math.sqrt(total):""}${S.introDone?"":" intro"}">${card.map((q,i)=>{const hs=byQ[q.id];const c=hs?hs.length:0;
      return `<button class="sq${c?" hit":""}${bs.cells.has(i)?" line":""}${S.justQ===q.id?" pop":""}${!closed&&pick&&q.id===pick.id?" hint":""}" data-q="${q.id}" ${c?`data-initials="${c}×"`:""} ${closed?"disabled":""}>
        <q>${esc(q.text)}</q><span class="meta">${bs.lines?(c?esc(pName(hs[0].sayerId)):""):(c?`laatst ${esc(pName(hs[0].sayerId))} · ${esc(fmt(hs[0].at))}`:"Tik als je het hoort")}</span></button>`}).join("")}</div>`;
  S.justQ=null;S.introDone=true;
}

function viewRanking(v){
  if(!S.players.length){v.innerHTML=`<div class="empty"><h2>Nog geen ranking</h2><p>Zodra er spelers zijn toegevoegd en de eerste quotes zijn gehoord, verschijnt hier de stand.</p></div>`;return}
  const r=scores();
  const topHeard=Math.max(0,...r.map(x=>x.heard)),topSaid=Math.max(0,...r.map(x=>x.said));
  const uniq=(k,v)=>r.filter(y=>y[k]===v).length===1;
  const aw=x=>(topHeard>0&&x.heard===topHeard&&uniq("heard",topHeard)?`<span class="award">Scherpste oor</span>`:"")+(topSaid>0&&x.said===topSaid&&uniq("said",topSaid)?`<span class="award said">Cliché-kampioen</span>`:"");
  const mv=(x,i)=>{const p=prevRanks[x.id];if(p==null||p===i)return"";return p>i?`<span class="mv up" title="Gestegen">▲${p-i}</span>`:`<span class="mv down" title="Gedaald">▼${i-p}</span>`};
  const pod=S.hits.length&&r.length>=3?`<div class="podium">${[1,0,2].map(i=>{const x=r[i];return `<div class="pod p${i+1}"><div class="av">${esc(initials(x.name))}</div><div class="nm">${esc(x.name)}</div><div class="blk">${sgn(x.total)}<small>${i+1}e plek</small></div></div>`}).join("")}</div>`:"";
  v.innerHTML=`<div><span class="eyebrow">${S.meta&&S.meta.closed?"Eindstand":"Tussenstand · live"}</span><h2>${S.meta&&S.meta.closed?`${esc(r[0].name)} wint het teamweekend!`:"Wie luistert het best, wie praat het meest in clichés?"}</h2>
  <p class="lede">Elke keer dat je een quote hoort: +1. Elke keer dat iemand jou betrapt: −1. Wie aan het eind van het weekend bovenaan staat, wint. Pijltjes tonen wat er veranderd is sinds je vorige bezoek.</p></div>
  ${pod}
  <div class="board" role="table">
    <div class="row head" role="row"><span>#</span><span>Speler</span><span class="num">Gehoord</span><span class="num">Gezegd</span><span class="total" style="font:inherit">Totaal</span></div>
    ${r.map((x,i)=>`<div class="row${i===0&&x.total>0?" top1":""}${x.id===S.me?" me-row":""}" role="row">
      <span class="pos">${i===0&&x.total>0?"♥":i+1}</span><span class="name">${esc(x.name)}${mv(x,i)}${aw(x)}</span>
      <span class="num plus">+${x.heard}</span><span class="num min">−${x.said}</span>
      <span class="total">${x.total>0?"+":x.total<0?"−":""}${Math.abs(x.total)}</span></div>`).join("")}
  </div>`;
  clearTimeout(S.rankSave);S.rankSave=setTimeout(()=>{try{localStorage.setItem("qb-ranks",JSON.stringify(Object.fromEntries(r.map((x,i)=>[x.id,i]))))}catch{}},4000);
}

function viewLog(v){
  const newest=S.hits.map(hitTime).sort().pop();if(newest&&newest>logSeen){logSeen=newest;try{localStorage.setItem("qb-logseen",logSeen)}catch{};const lb=document.querySelector('nav button[data-view="log"]');if(lb)delete lb.dataset.count}
  if(!S.hits.length){v.innerHTML=`<div class="empty"><h2>Nog niets betrapt</h2><p>Elke vangst verschijnt hier, met wie de quote zei, wie hem hoorde, wanneer, en de reactie erbij.</p></div>`;return}
  const list=[...S.hits].sort((a,b)=>String(hitTime(b)).localeCompare(String(hitTime(a))));
  const closed=!!(S.meta&&S.meta.closed);

function openSheet(qid){
  if(S.meta&&S.meta.closed){toast("Het spel is afgelopen");return}
  const q=S.quotes.find(x=>x.id===qid);const me=S.me;
  const prev=S.hits.filter(h=>h.hearerId===me&&h.quoteId===qid).length;

  const root=$("#sheet-root");
  root.innerHTML=`<div class="sheet" id="sheet"><form class="box" id="f-hit">
    <span class="eyebrow">Gehoord!${prev?` · jij ving deze al ${prev}×`:""}</span>
    <blockquote>“${esc(q.text)}”</blockquote>
    ${others.length?`<div class="row2">
      <label for="in-sayer">Wie zei het?<select id="in-sayer" required><option value="">Kies…</option>${others.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></label>
      <label for="in-at">Wanneer?<input type="datetime-local" id="in-at" required value="${localNow()}"></label>
    </div>
    <label for="in-comment"><span>Reactie <span class="small" style="font-weight:500">(optioneel)</span></span><textarea id="in-comment" rows="2" maxlength="140" placeholder="Bijv. Midden in de warming-up, iedereen lag dubbel"></textarea></label>`
    :`<p class="err">Er staat nog niemand anders in het team. Vraag de organisator om spelers toe te voegen.</p>`}
    <p class="err" id="hit-err" hidden></p>
    <div class="actions">
      <button type="button" class="btn ghost" id="close">Annuleren</button>
      <button class="btn primary" ${others.length?"":"disabled"}>Afvinken</button>
    </div></form></div>`;
  $("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet"||e.target.id==="close")root.innerHTML=""});
  $("#f-hit").addEventListener("submit",async e=>{e.preventDefault();
    const sayerId=$("#in-sayer").value,at=$("#in-at").value,comment=$("#in-comment").value.trim().slice(0,140);
    if(!sayerId||!at)return;
    const el=$("#hit-err");
    if(S.hits.some(h=>h.hearerId===me&&h.quoteId===qid&&h.sayerId===sayerId&&Date.now()-new Date(h.createdAt||0)<5*60000)){
      el.hidden=false;el.textContent=`Je hebt ${pName(sayerId)} net al op deze quote betrapt. Wacht 5 minuten voordat je hem opnieuw telt.`;return}
    const btn=e.target.querySelector(".btn.primary");btn.disabled=true;
    const before=S.hits.filter(h=>h.hearerId===me);const card=cardFor(me);const hb=new Set(before.map(h=>h.quoteId).filter(id=>card.some(x=>x.id===id)));const distinctBefore=hb.size;const b0=bingoState(card,hb).count;hb.add(qid);const b1=bingoState(card,hb).count;
    try{const ref=S.db.collection("hits").doc();S.known&&S.known.add(ref.id);
      const data={quoteId:qid,hearerId:me,sayerId,at,uid:S.uid,createdAt:new Date().toISOString()};if(comment)data.comment=comment;
      await ref.set(data);
      root.innerHTML="";S.justQ=qid;
      const n=before.length+1;const got=BADGES.find(([k])=>k===n);
      const full=!prev&&distinctBefore+1===card.length;
      if(b1>b0){celebrate(true);toast(b1>1?`BINGO! Al ${b1} lijnen vol.`:"BINGO! Je eerste lijn is vol.","big",4000)}
      else if(got){celebrate(true);toast(`Badge verdiend: ${got[1]}!`,"big",3600)}
      else if(full){celebrate(true);toast("Volle kaart! Elke quote gehoord.","big",3600)}
      else{celebrate(false);toast(`+1 voor jou, −1 voor ${pName(sayerId)}`)}
      render()}
    catch(err){btn.disabled=false;el.hidden=false;el.textContent=writeErr(err)}
  });
}

/* ---------- data (Firebase) ---------- */
async function connect(code){
  S.code=code;S.status="loading";S.unsubs.forEach(u=>u());S.unsubs=[];render();
  try{if(!firebase.auth().currentUser)await firebase.auth().signInAnonymously()}catch{S.status="offline";render();return}
  const db=firebase.firestore().collection("games").doc(code);
  S.db=db;let loaded=0;
  const sub=(name,key,sort)=>S.unsubs.push(db.collection(name).onSnapshot(snap=>{
    S[key]=snap.docs.map(d=>({id:d.id,...d.data()})).sort(sort);
    if(key==="players"&&S.me&&!S.players.some(p=>p.id===S.me)&&!snap.metadata.fromCache)S.me=null;
    if(++loaded>=4&&S.status==="loading")S.status="ready";
    if(S.status!=="adminlogin")render();
  },()=>{S.status="offline";render()}));
  sub("players","players",(a,b)=>a.name.localeCompare(b.name));
  sub("quotes","quotes",(a,b)=>(a.order??0)-(b.order??0));
  sub("hits","hits",(a,b)=>String(a.at).localeCompare(String(b.at)));
  sub("claims","claimsList",()=>0);
  S.unsubs.push(db.collection("meta").doc("state").onSnapshot(d=>{S.meta=d.exists?d.data():{};if(S.status==="ready")render()},()=>{}));
}

  let started=false;
  firebase.auth().onAuthStateChanged(u=>{
    S.admin=!!u&&!u.isAnonymous;S.uid=u?u.uid:null;
    if(!started){started=true;let code=null;try{code=localStorage.getItem("qb-code")}catch{}
      try{const lc=new URLSearchParams(location.search).get("code");if(lc){code=lc.trim().toUpperCase().replace(/[^A-Z0-9-]/g,"");localStorage.setItem("qb-code",code);history.replaceState(null,"",location.pathname+location.hash)}}catch{}
      if(code)connect(code);else{S.status="needcode";render()}}
    else if(S.status!=="adminlogin")render();
  });
}
</script>
</body>
</html>
